name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط ملف المشروع المرفوع
      - name: Unzip project files
        run: unzip *.zip -d project_dir

      # 4. بناء وتوقيع الـ Release APK
      - name: Build and Sign Release APK
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Djava.awt.headless=true"
        run: |
          TARGET_DIR=$(find project_dir -name "settings.gradle.kts" -exec dirname {} \;)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ خطأ: لم يتم العثور على ملفات مشروع أندرويد!"
            exit 1
          fi
          cd "$TARGET_DIR"
          
          echo "🛠️ 1. تجهيز الـ Gradle Wrapper وتصاريح التشغيل..."
          gradle wrapper
          chmod +x gradlew
          
          echo "🛠️ 2. إنشاء مفتاح Release دائم للتوقيع..."
          keytool -genkey -v -keystore release.keystore \
            -alias cashier_alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "CashierStorePass123" \
            -keypass "CashierKeyPass123" \
            -dname "CN=Cashier POS, OU=POS Unit, O=POS App, L=Basra, C=IQ"

          echo "🛠️ 3. التحقق من وجود ملف الخدمات لجوجل (Google Services)..."
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info": {"project_number": "123456789", "project_id": "casher-mock-id"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:123456", "android_client_info": {"package_name": "com.aistudio.restaurantpos.vmdjqk"}}, "api_key": [{"current_key": "mock_api_key_here"}]}]}' > app/google-services.json
          fi

          echo "🚀 4. بناء نسخة الـ Release..."
          ./gradlew assembleRelease --no-daemon

          echo "🛠️ 5. محاذاة وتوقيع الـ APK النهائي..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" -o -name "*-release-unsigned.apk" | head -n 1)
          
          if [ -z "$UNSIGNED_APK" ]; then
            # في حال تم التوليد كـ release مباشر
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app/build/outputs/apk/release/app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-key-alias cashier_alias \
            --ks-pass pass:CashierStorePass123 \
            --key-pass pass:CashierKeyPass123 \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          echo "✅ تم بناء وتوقيع الـ Release APK بنجاح!"

      # 5. استخراج ملف الـ APK النهائي الجاهز للثبيت
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cashier-POS-Release
          path: project_dir/**/build/outputs/apk/release/app-release-signed.apk
